<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Imagem destaque principal">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89B7FF"/>
      <stop offset="0.55" stop-color="#E9F2FF"/>
      <stop offset="1" stop-color="#FFE4B8"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0e0e"/>
      <stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ebb841" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FF7A59" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <!-- Céu -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <path d="M0 580 C240 520 420 640 640 600 C920 550 1100 480 1600 560 L1600 1000 L0 1000 Z" fill="url(#sunset)" filter="url(#soft)" opacity="0.85"/>

  <!-- Horizonte / cidade estilizada -->
  <path d="M0 690 C220 640 420 720 620 690 C880 650 1100 640 1600 700 L1600 1000 L0 1000 Z" fill="url(#city)"/>
  <g opacity="0.25">
    <rect x="120" y="610" width="70" height="120" rx="8" fill="#0B3A86"/>
    <rect x="220" y="585" width="110" height="165" rx="10" fill="#0B3A86"/>
    <rect x="360" y="620" width="80" height="130" rx="8" fill="#0B3A86"/>
    <rect x="500" y="575" width="140" height="190" rx="12" fill="#0B3A86"/>
    <rect x="680" y="615" width="95" height="145" rx="10" fill="#0B3A86"/>
    <rect x="820" y="590" width="120" height="180" rx="12" fill="#0B3A86"/>
    <rect x="980" y="625" width="90" height="140" rx="10" fill="#0B3A86"/>
    <rect x="1110" y="570" width="150" height="210" rx="14" fill="#0B3A86"/>
    <rect x="1300" y="610" width="100" height="160" rx="12" fill="#0B3A86"/>
  </g>

  <!-- Silhueta “premium” (formas lembrando arquitetura) -->
  <g opacity="0.9">
    <path d="M740 560 L800 520 L860 560 L860 860 L740 860 Z" fill="#EAF1FF" opacity="0.25"/>
    <path d="M760 575 L800 545 L840 575 L840 860 L760 860 Z" fill="#F5F5F5" opacity="0.22"/>
    <path d="M520 770 C620 720 710 725 800 760 C890 795 1010 800 1120 740 L1120 900 L520 900 Z" fill="#0e0e0e" opacity="0.18"/>
  </g>
</svg>
